name: 7大师量化选股与推送

on:
  schedule:
    # 北京时间周一至周五 14:30（A股尾盘分析）
    - cron: '30 6 * * 1-5'
    # 北京时间周一至周五 21:00（美股开盘前分析）
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # 支持手动点击按钮随时运行

jobs:
  run-stock-picker:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行量化选股脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python main.py
