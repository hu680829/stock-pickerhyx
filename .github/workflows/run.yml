name: Stock Picker
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          pip install requests akshare pandas tabulate
      - name: Run
        run: python main.py
