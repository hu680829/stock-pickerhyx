name: Daily Stock Picker

on:
  schedule:
    - cron: '30 7 * * 1-5' # 周一至周五 北京时间 15:30 自动执行
  workflow_dispatch: # 支持手动点击触发

jobs:
  run-picker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install -r requirements.txt

      - name: 执行选股脚本
        run: python main.py
